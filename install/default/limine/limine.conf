### Presentation only. 13-bootloader.sh appends the entries that limine-update
### generates beneath this header. See
### https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md

### One second, not zero. Long enough to catch on purpose, short enough not to
### wait on. Reaching a snapshot entry after a bad update is a priority-1 path
### and a menu you cannot stop is not one.
timeout: 1

### Entry 1 is the newest kernel, per BOOT_ORDER in /etc/default/limine.
### 13-bootloader.sh refuses to commit a config whose first entry is a folder
### rather than a bootable leaf — limine will not boot a folder, it silently
### forces the timeout off and waits for input forever, and the only symptom is
### a machine that never comes up.
default_entry: 1

interface_branding:
hash_mismatch_panic: no

### Bunny palette: matte black ground, neon accents.
term_background: 0d0d0d
backdrop: 0d0d0d

term_palette: 1a1a1a;ff5c8a;7fffd4;ffd479;7fc8ff;c792ea;5ff5e0;d8d8d8
term_palette_bright: 3a3a3a;ff5c8a;7fffd4;ffd479;7fc8ff;c792ea;5ff5e0;f0f0f0

term_foreground: d8d8d8
term_foreground_bright: f0f0f0
term_background_bright: 1a1a1a
