# Overrides for /etc/limine-entry-tool.conf. Upstream's instruction is to
# override here rather than edit that pacman-owned file.

TARGET_OS_NAME="BunnE"

ESP_PATH="/boot"

# @@CMDLINE@@ is replaced at install time with the command line the base install
# produced — cryptdevice=, root=, rootflags= and friends, which are per-machine
# and must never be guessed. The append below is the only part this repo owns,
# and 13-bootloader.sh strips these same arguments before substituting so a
# re-run cannot grow the line.
KERNEL_CMDLINE[default]="@@CMDLINE@@"
KERNEL_CMDLINE[default]+=" quiet splash nowatchdog plymouth.ignore-serial-consoles"
KERNEL_CMDLINE[default]+=" loglevel=3 systemd.show_status=auto rd.udev.log_level=3"

# One UKI, generated by limine-update and by nothing else. 13-bootloader.sh
# comments out mkinitcpio's own UKI preset so there is a single authoritative
# generator; two of them racing is how a machine ends up booting an image no
# kernel update has touched.
ENABLE_UKI=yes
CUSTOM_UKI_NAME="bunny"

# Install limine as the ESP fallback loader (/EFI/BOOT/BOOTX64.EFI) so the
# machine still boots after a firmware update wipes its NVRAM boot entries.
ENABLE_LIMINE_FALLBACK=yes

# ...and therefore do NOT auto-discover other bootloaders: the fallback loader
# now IS limine, so discovery produces a menu entry that chainloads the menu you
# are already looking at. A machine that dual-boots Windows flips this to yes.
FIND_BOOTLOADERS=no

BOOT_ORDER="*, *fallback, Snapshots"

MAX_SNAPSHOT_ENTRIES=5

SNAPSHOT_FORMAT_CHOICE=5
