# Managed by the BunnE installer. Included from /etc/pacman.conf.
#
# [omarchy] is the only third-party repository, and it exists for packages that
# are otherwise AUR-only builds: limine-snapper-sync, limine-mkinitcpio-hook,
# xdg-terminal-exec, gpu-screen-recorder and yay itself. It ships an unsigned
# database, so this is a real trust decision — the machine executes whatever that
# server publishes, as root, on every upgrade.
[omarchy]
SigLevel = Optional TrustAll
Server = https://pkgs.omarchy.org/stable/$arch
