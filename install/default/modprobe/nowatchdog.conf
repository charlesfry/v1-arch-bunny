# The hardware watchdog is not used here and its module delays shutdown.
# sp5100_tco is the AMD/Ryzen one — this is a Framework 13 AMD. The Intel
# equivalents are listed too so the file is correct on either machine; a
# blacklist entry for an absent module is inert.
blacklist sp5100_tco
blacklist iTCO_wdt
blacklist iTCO_vendor_support
